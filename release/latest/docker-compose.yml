services:
  designer:
    profiles: ["full"]
    image: fogflow/designer:latest
    volumes:
      - ./.config.json:/app/config.json:ro
      - ${DESIGNER_DB_DIR}:/app/public/data/meta
    ports:
      - "${DESIGNER_WEB_PORT}:${DESIGNER_WEB_PORT}"
      - "${DESIGNER_AGENT_PORT}:${DESIGNER_AGENT_PORT}"
      - "${DESIGNER_LD_AGENT_PORT}:${DESIGNER_LD_AGENT_PORT}"
    depends_on:
      - discovery
      - cloud_broker
      - rabbitmq
    restart: always

  discovery:
    profiles: ["full"]
    image: fogflow/discovery:latest
    volumes:
      - ./.config.json:/config.json:ro
      - ${DISCOVERY_DB_DIR}:/discoveryDB
    ports:
      - "${DISCOVERY_PORT}:${DISCOVERY_PORT}"
    restart: always

  master:
    profiles: ["full"]
    image: fogflow/master:latest
    volumes:
      - ./.config.json:/config.json:ro
    ports:
      - "${MASTER_NGSI_AGENT_PORT}:${MASTER_NGSI_AGENT_PORT}"
      - "${MASTER_REST_API_PORT}:${MASTER_REST_API_PORT}"
    depends_on:
      - rabbitmq
      - discovery
      - cloud_broker
    restart: always

  cloud_broker:
    profiles: ["full"]
    image: fogflow/broker:latest
    volumes:
      - ./.config.json:/config.json:ro
    ports:
      - "${BROKER_PORT}:${BROKER_PORT}"
    depends_on:
      - discovery
    restart: always

  edge_broker:
    profiles: ["edge"]
    image: fogflow/broker:latest
    volumes:
      - ./.config.json:/config.json:ro
    ports:
      - "${BROKER_PORT}:${BROKER_PORT}"
    restart: always

  worker_airflow:
    profiles: ["worker_airflow"]
    image: fogflow/worker:latest
    volumes:
      - ./.config.json:/config.json:ro
      - ${AIRFLOW_DAGS}:/airflow_home
      - ${PYMODULE_REPO}:/local_pymodules_repository
    restart: always

  worker_docker:
    profiles: ["worker_docker"]
    image: fogflow/worker:latest
    volumes:
      - ./.config.json:/config.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

  rabbitmq:
    profiles: ["full"]
    image: rabbitmq:3.8
    ports:
      - "${RABBITMQ_PORT}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    restart: always

  nginx:
    profiles: ["full"]
    image: nginx:latest
    volumes:
      - ./.nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      - discovery
      - cloud_broker
      - designer
    restart: always